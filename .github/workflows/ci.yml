# Runs on every push and pull request: the same checks as locally, so a PR
# shows a red ✗ before a broken change reaches the live site.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check:dates compares the pull request with its base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Pages whose content changed need a new date in src/data/dates.ts.
      - run: npm run check:dates
        if: github.event_name == 'pull_request'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Only the browser the tests use, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
